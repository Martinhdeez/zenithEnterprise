# The "Cyber Standards Archive" demonstration corpus.
#
# The PDFs are not committed — they belong to their publishers and a repository is a poor
# place for a hundred megabytes. What is committed is where each came from, why it is in the
# set, and the checksum of the bytes actually ingested. Public URLs are not immutable: an
# agency reissues a document and a corpus silently becomes a different corpus.
#
# Every file here is freely redistributable. NIST publications are US government work in the
# public domain; CISA publishes its guidance openly.
#
# This corpus has **no measured recall figure** and must never be quoted as if it did. The
# measured baseline is the other tenant's — see `.artifacts/specs/2026-08-26-what-this-demo-claims.md`.

