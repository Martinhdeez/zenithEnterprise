id = "nasa-technical-report"
url = "https://ntrs.nasa.gov/api/citations/19720005243/downloads/19720005243.pdf"
category = "scanned"
difficulty = ["scanned", "tables", "engineering-notation"]
why = """
A 1970s engineering report: scanned, full of tables and notation. The closest public thing
to the equipment manuals a manufacturing customer would bring.

Measured after downloading: it does carry a text layer, but a thin one — around 330
characters per page against 3,000-5,000 for a born-digital document. NTRS has OCR'd it,
badly. That is the realistic enterprise scan: not absent text, but degraded text, which is
harder to notice because nothing looks broken.
"""
sha256 = "03fc440b16cd62fa2f8b339e0d85a01ddf77109a23452a1e9c4603bab76a79b6"
