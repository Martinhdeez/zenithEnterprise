# The M0 evaluation corpus.
#
# Public documents only. Design partners are still TBD, and RNF-07 forbids using a
# customer's documents with cloud APIs even once one exists — so the corpus is built from
# material that resembles enterprise documentation in structure without belonging to
# anyone.
#
# Chosen for difficulty, not convenience. The rule is **harder than what a customer will
# upload**: a pipeline that survives a 1970s scan survives a clean contract, and the
# reverse is not true.
#
# `sha256` and `pages` are filled in by `python -m eval fetch --record`, so a document
# silently replaced at its URL fails the checksum rather than quietly changing what the
# baseline was measured against.
#
# **Size is a selection criterion, not an accident.** The 1994 Congressional Record (562 MB)
# and the Statutes at Large (78 MB) were both dropped after being measured: they are scans,
# which the corpus needs, but a single document that dwarfs the other twelve combined makes
# every M0 iteration slow without making it more representative. Nobody uploads a bound
# annual volume. The scanned category is covered by two NASA reports at 4.6 and 1.2 MB,
# which fail extraction in exactly the same way for a fraction of the wall clock.
#
# **Known gap: no document without a text layer at all.** Both scans turned out to be
# pre-OCR'd by their publishers — degraded text rather than none. That is the common
# enterprise case and worth having, but the *dangerous* case is different: a PDF with no
# text layer ingests successfully, produces zero chunks, and retrieves nothing, with no
# error anywhere. Nothing here currently exercises that path. Recorded rather than papered
# over; it needs a genuinely image-only document, and F5 must fail loudly on one.
#
# **The corpus also has to be big enough to be a fair test.** Retrieval on five documents is
# easy because there is nothing to confuse it with; the distractors are what make Recall@8
# mean something. Thirteen documents across seven categories, several plausibly relevant to
# the same question, is the minimum that seemed honest.

[[document]]
id = "gdpr"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32016R0679"
category = "regulation"
difficulty = ["dense", "cross-referential", "numbered-articles"]
why = """
The closest public analogue to a corporate policy document: numbered articles that refer
to each other constantly, so the right answer is often one clause among many that look
alike. Also the case where lexical search earns its place — "Article 17" is an exact
string a vector search will happily approximate.
"""
sha256 = "bd84e63f5b622b739a83389afc3b30d240f792bb88d8eb03a816c9a82b0c2499"
pages = 88
bytes = 982296

