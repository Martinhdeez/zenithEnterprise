# The M0 question set — 30 questions, every page resolved from the extracted text.
#
# `anchor` is a phrase that genuinely appears in the document; `pages` is every page
# containing it, looked up rather than typed. `test_questions.py` re-derives both, so
# "hand-verified" is a property the suite re-checks rather than a claim in a commit.
#
# A question may legitimately be answered from more than one page — a regulation states
# a rule in a recital and again in an article — so `pages` is a list and retrieval is
# credited for finding any of them.
#
# `unanswerable` questions carry no document: the corpus does not contain the answer.
# They measure abstention, not recall, and recall is undefined for them.

