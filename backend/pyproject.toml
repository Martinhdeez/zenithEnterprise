[project]
name = "zenith-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "procrastinate[psycopg2]>=2.15",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    "structlog>=24.4",
    "typer>=0.15",
    "pydantic[email]>=2.13.4",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
]

[project.scripts]
zenith = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pip-licenses>=5.0",
    "sentence-transformers>=5.6.1",
    "reportlab>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["app", "eval", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app", "eval", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
