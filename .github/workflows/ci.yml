name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run pyright

      # Tests spin up real Postgres via testcontainers: SQLite has no pgvector, no
      # RLS and no tsvector, and those are exactly what is under test here.
      - name: Tests
        run: uv run pytest

      # NFR: no dependency under a copyleft or non-commercial licence.
      # This fails the build rather than warning: an AGPL package slipping into the
      # tree is a legal problem, not a style nit.
      - name: Licenses
        # The job runs from `backend/`; the script lives at the repository root and
        # re-enters `backend/` itself, so it is reached by going up one level.
        run: ../scripts/check-licences.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if
      # package.json and the lock have drifted, which is the whole point of running it
      # here rather than on a developer's machine.
      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run lint

      # The assertions that matter are the ones keeping the fabrication gate intact on
      # this side of the wire: an abstained result must replace streamed text, never be
      # appended to it.
      - name: Tests
        run: npm run test
