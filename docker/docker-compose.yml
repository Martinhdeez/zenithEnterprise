name: zenith

services:
  db:
    # ParadeDB ships pgvector and pg_search in one image: both halves of hybrid
    # search without adding another service to the deployment.
    image: paradedb/paradedb:0.15.26-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenith}
      POSTGRES_DB: ${POSTGRES_DB:-zenith}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenith}"]
      interval: 5s
      timeout: 5s
      retries: 20

  tei-embed:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    # These two numbers must agree with the ZENITH_HARDWARE profile the application runs
    # with — see `app/core/hardware.py`. They are the difference between an installation
    # that serves and one the kernel kills: with TEI's defaults, M0 watched this container
    # reach 6.59 GB RSS during warm-up on a 7.6 GB machine and get OOM-killed before it had
    # processed a single document. With the values below it loads and serves at 3.71 GB.
    #
    # `--max-concurrent-requests` is deliberately absent. Passing it panics cpu-1.8 outright
    # ("Queue background task dropped the receiver... This is a bug", exit 139). Concurrency
    # is limited on our side instead, by the worker.
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--auto-truncate"
      - "--max-batch-tokens"
      - "${TEI_MAX_BATCH_TOKENS:-2048}"
      - "--max-client-batch-size"
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-4}"
    ports:
      - "${TEI_EMBED_PORT:-8081}:80"
    volumes:
      - hf_cache:/data

  tei-rerank:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--auto-truncate"]
    ports:
      - "${TEI_RERANK_PORT:-8082}:80"
    volumes:
      - hf_cache:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [../.env]
    environment:
      ZENITH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zenith}:${POSTGRES_PASSWORD:-zenith}@db:5432/${POSTGRES_DB:-zenith}
      ZENITH_TEI_EMBED_URL: http://tei-embed:80
      ZENITH_TEI_RERANK_URL: http://tei-rerank:80
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    # One document at a time by default. On `low-spec` that is not a preference: the
    # parser's memory and the embedder's must not overlap on a machine M0 already pushed
    # into an out-of-memory kill.
    command:
      - "procrastinate"
      - "--app=app.features.ingestion.tasks.app"
      - "worker"
      - "--concurrency"
      - "${ZENITH_WORKER_CONCURRENCY:-1}"
    env_file: [../.env]
    environment:
      ZENITH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zenith}:${POSTGRES_PASSWORD:-zenith}@db:5432/${POSTGRES_DB:-zenith}
      ZENITH_TEI_EMBED_URL: http://tei-embed:80
      ZENITH_TEI_RERANK_URL: http://tei-rerank:80
    depends_on:
      db: {condition: service_healthy}

volumes:
  db_data:
  hf_cache:
