name: zenith

services:
  db:
    # ParadeDB ships pgvector and pg_search in one image: both halves of hybrid
    # search without adding another service to the deployment.
    image: paradedb/paradedb:0.15.26-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenith}
      POSTGRES_DB: ${POSTGRES_DB:-zenith}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Docker gives a container 64 MB of /dev/shm, and Postgres allocates a parallel
    # query's shared workspace there. A parallel scan over a large table asks for more
    # than that and dies with `DiskFull: could not resize shared memory segment`, which
    # names the wrong resource entirely — measured here on a 150,000-row table with
    # 389 GB free on the volume, while somebody read the message and went to check disk.
    #
    # It cannot happen on the demonstration corpus, which is why it has not: 13,549
    # passages never reach a parallel plan. It becomes reachable at the corpus sizes this
    # product is being aimed at, and it arrives as a 500 on an ordinary search.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenith}"]
      interval: 5s
      timeout: 5s
      retries: 20

  tei-embed:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    # These two numbers must agree with the ZENITH_HARDWARE profile the application runs
    # with — see `app/core/hardware.py`. They are the difference between an installation
    # that serves and one the kernel kills: with TEI's defaults, M0 watched this container
    # reach 6.59 GB RSS during warm-up on a 7.6 GB machine and get OOM-killed before it had
    # processed a single document. With the values below it loads and serves at 3.71 GB.
    #
    # `--max-concurrent-requests` is deliberately absent, and this is not a precaution.
    # Measured on this exact image: with the flag set, TEI panics and exits 139 after as few
    # as **three sequential requests** —
    #
    #   thread 'tokio-runtime-worker' panicked at core/src/queue.rs:87:14:
    #   Queue background task dropped the receiver or the receiver is too behind.
    #   This is a bug.: "Full(..)"
    #
    # Sequential requests are enough to trigger it, so our own sequential worker is no
    # defence here — it protects against memory, not against this. The count before death
    # varied between 3 and ~20 across runs, which is what a race in a bounded queue looks
    # like, and it means a smoke test can pass and production can still die the same day.
    # See `.artifacts/specs/2026-08-02-f5-validation.md`.
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--auto-truncate"
      - "--max-batch-tokens"
      - "${TEI_MAX_BATCH_TOKENS:-2048}"
      - "--max-client-batch-size"
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-4}"
    ports:
      - "${TEI_EMBED_PORT:-8081}:80"
    volumes:
      - hf_cache:/data
    # Embedding on CPU will take every core it is given: unlimited, this container ran at
    # 1301% on a 14-core laptop and the machine got hot enough for its owner to come asking
    # what was wrong. Ingestion is a background job and nobody is watching it finish, so the
    # trade is the right way round — the box stays usable while a long document is indexed.
    #
    # It is a ceiling, not a reservation, and it is here rather than in a `docker update`
    # because that one is lost the next time the container is recreated.
    cpus: ${TEI_CPUS:-4.0}

  tei-rerank:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    # These flags were missing until F11 measured what their absence does, and their
    # absence was worse than a wrong value. `TeiReranker.plan_batches` builds batches up to
    # the profile's `max_client_batch_size` — 16 on `cpu`, 32 on `gpu`. TEI's own default
    # is smaller, so every rerank request was rejected with
    #
    #   batch size 14 > maximum allowed batch size 4
    #
    # and `SearchService` did exactly what it was designed to do: caught it, fell back to
    # the fused order, and returned a perfectly good answer marked `degraded`. Nothing
    # crashed. The customer pays for a reranker that never runs once, and the only symptom
    # is a recall number 15 points below what F7 measured.
    #
    # They share the embedder's variables deliberately. One TEI setting must never be
    # configurable in two places that can disagree — that is the mistake this comment
    # exists to prevent from recurring.
    # The model is a variable because it is a latency decision, and the right answer differs
    # by an order of magnitude between a CPU and a GPU. Measured on the 30-question live set
    # over a 21,295-passage corpus, same queries, same everything else:
    #
    #                              Recall@8   Recall@1   mean rank   median latency
    #   mmarco-mMiniLMv2-L12         85.0%      66.7%       1.35          784 ms
    #   bge-reranker-v2-m3           85.0%      76.7%       1.12       13,731 ms
    #
    # **Recall@8 is identical**, which is the number the answer path depends on: generation
    # is handed eight passages either way, so the model sees the same evidence. What the
    # larger cross-encoder buys is the *order* within those eight — ten points more often
    # putting the answer first — and on this hardware it costs 17x the latency to do it.
    #
    # The default is therefore the small one, because a 13-second search is not a product.
    # On a GPU the trade reverses: set `TEI_RERANK_MODEL=BAAI/bge-reranker-v2-m3` there and
    # it is strictly better.
    #
    # Not calibrated by candidate count either — that was tried. `rerank_candidates=32` with
    # the small model made it *worse*: Recall@1 66.7% -> 53.3%, mean rank 1.35 -> 1.62, at
    # 2,781 ms. A weaker cross-encoder handed four times the candidates has four times the
    # opportunities to be wrong, and RRF's ordering of the top eight was better than its
    # reordering of thirty-two. Depth is not a substitute for a better judge.
    command:
      - "--model-id"
      - "${TEI_RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"
      - "--auto-truncate"
      - "--max-batch-tokens"
      - "${TEI_MAX_BATCH_TOKENS:-2048}"
      - "--max-client-batch-size"
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-4}"
    ports:
      - "${TEI_RERANK_PORT:-8082}:80"
    volumes:
      - hf_cache:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [../.env]
    environment:
      # `zenith_app`, never the owner (`${POSTGRES_USER}`) — the owner bypasses every RLS
      # policy, which `verify_rls_active()` refuses to start against. See db.7's role setup.
      ZENITH_DATABASE_URL: postgresql+psycopg://zenith_app:${ZENITH_APP_PASSWORD:-zenith_app}@db:5432/${POSTGRES_DB:-zenith}
      ZENITH_DATABASE_OWNER_URL: postgresql+psycopg://${POSTGRES_USER:-zenith}:${POSTGRES_PASSWORD:-zenith}@db:5432/${POSTGRES_DB:-zenith}
      # Bypasses RLS and holds no DDL: the system administration panel only, via
      # `platform_session`. Migration 0010 creates the role NOLOGIN — the operator sets
      # the password, exactly as with zenith_app.
      ZENITH_DATABASE_PLATFORM_URL: postgresql+psycopg://zenith_platform:${ZENITH_PLATFORM_PASSWORD:-zenith_platform}@db:5432/${POSTGRES_DB:-zenith}
      ZENITH_TEI_EMBED_URL: http://tei-embed:80
      ZENITH_TEI_RERANK_URL: http://tei-rerank:80
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Bind-mounted, not a named volume: the tenant's documents already live on the host
      # at this path from earlier non-docker (`uv run`) sessions, content-addressed by
      # sha256 under `ZENITH_STORAGE_DIR`. A named volume would start empty and every
      # existing row in `documents` would point at a file the container can never see —
      # `PdfViewer.tsx` renders exactly that as "That document is no longer available."
      - ../backend/.data/documents:/data/documents
    depends_on:
      db: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    # One document at a time by default. On `low-spec` that is not a preference: the
    # parser's memory and the embedder's must not overlap on a machine M0 already pushed
    # into an out-of-memory kill.
    #
    # This argument is what actually decides it — `Profile.ingestion_concurrency` records the
    # value for the hardware and cannot enforce it, because procrastinate fixes concurrency at
    # launch. `zenith diagnose` prints the active profile; `tasks.worker_concurrency()` is the
    # number to put here for it.
    command:
      - "procrastinate"
      - "--app=app.features.ingestion.tasks.app"
      - "worker"
      - "--concurrency"
      - "${ZENITH_WORKER_CONCURRENCY:-1}"
    env_file: [../.env]
    environment:
      # Same role as `api` — a worker writing chunks with RLS disabled is as dangerous as
      # an API reading them (see `core.database.verify_rls_active`).
      ZENITH_DATABASE_URL: postgresql+psycopg://zenith_app:${ZENITH_APP_PASSWORD:-zenith_app}@db:5432/${POSTGRES_DB:-zenith}
      ZENITH_DATABASE_OWNER_URL: postgresql+psycopg://${POSTGRES_USER:-zenith}:${POSTGRES_PASSWORD:-zenith}@db:5432/${POSTGRES_DB:-zenith}
      ZENITH_DATABASE_PLATFORM_URL: postgresql+psycopg://zenith_platform:${ZENITH_PLATFORM_PASSWORD:-zenith_platform}@db:5432/${POSTGRES_DB:-zenith}
      ZENITH_TEI_EMBED_URL: http://tei-embed:80
      ZENITH_TEI_RERANK_URL: http://tei-rerank:80
    volumes:
      # Same mount as `api`, same reason — the worker is the one that writes newly
      # ingested files here, and it must land them in the same place `api` serves from.
      - ../backend/.data/documents:/data/documents
    depends_on:
      db: {condition: service_healthy}

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  db_data:
  hf_cache:
