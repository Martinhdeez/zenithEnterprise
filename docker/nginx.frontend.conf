server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1 MB and rejects anything larger itself, before the request ever
    # reaches the API. `settings.max_file_bytes` allows 100 MB, so with the default every
    # upload over 1 MB — which is most real PDFs; the corpus in this repo runs to 2.5 MB —
    # died with a 413 whose body is nginx's own HTML error page, not the API's JSON. The
    # client could not even read a message out of it and fell back to "The request failed."
    #
    # Development never saw this: vite's proxy has no such limit, so the ceiling only
    # appeared once the frontend was containerised. Matched to the application's own limit
    # deliberately — one number, enforced in one place, and the API is the place that can
    # explain itself when it refuses.
    client_max_body_size 100m;

    # Every top-level prefix the backend actually serves (see app/main.py's
    # include_router calls) — kept in sync by hand the same way vite.config.ts's
    # dev proxy is, since neither can import the other's route table.
    #
    # **A prefix missing from this list fails as a parse error, not a 404.** An unmatched
    # path falls through to the SPA below and is answered with index.html, so the client
    # gets HTML where it expected JSON and reports whatever its catch block says. `groups`
    # was added after the route existed and worked, and the symptom was "The request
    # failed" on a screen whose backend was fine — so when a new router lands, it lands
    # here too.
    location ~ ^/(auth|labels|documents|search|query|tenant|roles|groups|system|analytics|llm-config|users) {
        # Resolved per request, not once at startup. With a literal `proxy_pass
        # http://api:8000` nginx looks `api` up when it loads its configuration and then
        # holds that IP forever — so the moment the API container is recreated (every
        # `docker compose up --build api`) it gets a new address and nginx keeps dialling
        # the old one, answering 502 to everything until it is restarted by hand. Naming
        # Docker's embedded DNS server and putting the upstream in a variable forces the
        # lookup to happen per request instead, which is what makes a redeployed API
        # visible without touching the proxy.
        #
        # `$request_uri` is required rather than decorative: a `proxy_pass` with a variable
        # in it no longer appends the matched URI automatically, and without this every
        # request would arrive at the API as `/`.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /query streams SSE — buffering would hold the whole answer until the
        # connection closed instead of forwarding tokens as they arrive.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # nginx's stock mime.types has no `.mjs` entry, so the PDF viewer's worker script
    # (`pdf.worker.min.mjs`, loaded as an ES module) was served as
    # application/octet-stream — a type the browser's strict module-script MIME check
    # refuses to execute. Every citation click and every document preview failed with
    # "The document could not be rendered." for exactly that reason, never anything to
    # do with the file being missing or corrupt.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Vite fingerprints every built asset (`index-<hash>.js`) but not `index.html` itself,
    # and the stock config sent no `Cache-Control` on either — with nothing to go on, a
    # browser falls back to *heuristic* freshness from `Last-Modified`, which is exactly
    # the kind of caching that serves a stale bundle on an ordinary reload with no way to
    # tell it's stale (the `.mjs` MIME fix above hit this same class of problem from a
    # different angle). Split the two properly instead: content-hashed assets are safe to
    # cache forever, because a changed file is a changed URL; `index.html` is the one
    # response that must always be revalidated, since it is the only thing that references
    # the current hash.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
