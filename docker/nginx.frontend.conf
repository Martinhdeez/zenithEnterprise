server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Every top-level prefix the backend actually serves (see app/main.py's
    # include_router calls) — kept in sync by hand the same way vite.config.ts's
    # dev proxy is, since neither can import the other's route table.
    location ~ ^/(auth|labels|documents|search|query|tenant|roles|llm-config|users) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /query streams SSE — buffering would hold the whole answer until the
        # connection closed instead of forwarding tokens as they arrive.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # nginx's stock mime.types has no `.mjs` entry, so the PDF viewer's worker script
    # (`pdf.worker.min.mjs`, loaded as an ES module) was served as
    # application/octet-stream — a type the browser's strict module-script MIME check
    # refuses to execute. Every citation click and every document preview failed with
    # "The document could not be rendered." for exactly that reason, never anything to
    # do with the file being missing or corrupt.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Vite fingerprints every built asset (`index-<hash>.js`) but not `index.html` itself,
    # and the stock config sent no `Cache-Control` on either — with nothing to go on, a
    # browser falls back to *heuristic* freshness from `Last-Modified`, which is exactly
    # the kind of caching that serves a stale bundle on an ordinary reload with no way to
    # tell it's stale (the `.mjs` MIME fix above hit this same class of problem from a
    # different angle). Split the two properly instead: content-hashed assets are safe to
    # cache forever, because a changed file is a changed URL; `index.html` is the one
    # response that must always be revalidated, since it is the only thing that references
    # the current hash.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
